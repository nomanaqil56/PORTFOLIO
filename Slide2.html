<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noman Aqil Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:#050505;
  color:#fff;
  font-family:'Segoe UI',sans-serif;
  height:100vh;
  overflow:hidden;
}

/* ===== SLIDES ===== */
.slides{
  height:200vh;
  transition:transform 0.8s ease;
}

.section{
  height:100vh;
  position:relative;
}

/* ===== NAV ===== */
nav{
  position:absolute;
  top:20px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:24px;
  z-index:100;
  font-size:13px;
  letter-spacing:1px;
  color:#888;
}

/* ===== SLIM SIDE NAV ===== */
.side-nav{
  position:fixed;
  right:30px;
  top:50%;
  transform:translateY(-50%);
  width:14px;
  height:90px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:999px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-evenly;
  z-index:300;
}

.nav-dot{
  width:6px;
  height:6px;
  background:#aaa;
  border-radius:50%;
  opacity:0.4;
  transition:0.3s ease;
}

.nav-dot.active{
  opacity:1;
  background:#fff;
  box-shadow:0 0 8px rgba(255,255,255,0.6);
}

/* ===== BACKGROUND TEXT ===== */
.bg-text-container{
  position:absolute;
  inset:0;
  opacity:0.25;
}

.marquee{
  position:absolute;
  width:200%;
  display:flex;
  white-space:nowrap;
  font-size:clamp(8rem,18vw,18vw);
  font-family:'Oswald',sans-serif;
  font-weight:700;
  letter-spacing:-0.08em;
  color:#ccc;
}

.marquee.top{
  top:-8%;
  transform:rotate(-3deg);
  animation:marqueeLeft 45s linear infinite;
}

.marquee.bottom{
  top:60%;
  transform:rotate(3deg);
  animation:marqueeRight 45s linear infinite;
}

@keyframes marqueeLeft{
  from{transform:rotate(-3deg) translateX(0);}
  to{transform:rotate(-3deg) translateX(-50%);}
}

@keyframes marqueeRight{
  from{transform:rotate(3deg) translateX(-50%);}
  to{transform:rotate(3deg) translateX(0);}
}

/* ===== ABOUT ===== */
.about-section{
  position:absolute;
  top:20px;
  bottom:20px;
  left:10px;
  width:clamp(260px,28vw,320px);
}

.glass-box{
  height:100%;
  background:rgba(255,255,255,0.02);
  border:1px solid rgba(255,255,255,0.06);
  padding:24px;
  border-radius:14px;
  font-size:14px;
  line-height:1.5;
  color:#ddd;
}

/* ===== PROFILE ===== */
.profile-container{
  position:absolute;
  bottom:10px;
  right:10px;
  width:clamp(200px,28vw,340px);
  height:clamp(200px,28vw,340px);
  border-radius:50%;
  background:#4a4a4a;
  display:flex;
  align-items:center;
  justify-content:center;
}

.inner-circle{
  width:95%;
  height:95%;
  border-radius:50%;
  overflow:hidden;
}

.inner-circle img{
  width:100%;
  height:150%;
  object-fit:cover;
}

/* ===== SLIDE 2 ===== */
.slide2-wrapper{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 8vw;
}

.slide2-left{
  width:40%;
}

.slide2-left h1{
  font-family:'Oswald',sans-serif;
  font-size:clamp(3rem,5vw,5rem);
  line-height:1;
  margin-bottom:20px;
}

.slide2-intro{
  font-size:16px;
  color:#aaa;
  max-width:400px;
}

.slide2-right{
  width:50%;
  display:flex;
  flex-direction:column;
  gap:30px;
}

/* ===== FIXED CANVAS ===== */
#canvas-container{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:50;
}
</style>
</head>

<body>

<div class="slides" id="slides">

<!-- SLIDE 1 -->
<section class="section">
<nav>
  <span>HOME</span>
  <span>WORKS</span>
  <span>LINKEDIN</span>
  <span>CONTACT</span>
</nav>

<div class="bg-text-container">
  <div class="marquee top">
    <span>WEB&nbsp;&nbsp;WEB&nbsp;&nbsp;WEB&nbsp;&nbsp;</span>
    <span>WEB&nbsp;&nbsp;WEB&nbsp;&nbsp;WEB&nbsp;&nbsp;</span>
  </div>
  <div class="marquee bottom">
    <span>DEV&nbsp;&nbsp;DEV&nbsp;&nbsp;DEV&nbsp;&nbsp;</span>
    <span>DEV&nbsp;&nbsp;DEV&nbsp;&nbsp;DEV&nbsp;&nbsp;</span>
  </div>
</div>

<div class="about-section">
  <div class="glass-box">
    I build immersive digital systems blending design, interaction and 3D.
  </div>
</div>

<div class="profile-container">
  <div class="inner-circle">
    <img src="profile.jpeg">
  </div>
</div>
</section>

<!-- SLIDE 2 -->
<section class="section">
  <div class="slide2-wrapper">
    <div class="slide2-left">
      <h1>I BUILD<br>DIGITAL SYSTEMS</h1>
      <p class="slide2-intro">
        Creating immersive, scalable and performance-driven digital experiences.
      </p>
    </div>
  </div>
</section>

</div>

<div class="side-nav">
  <div class="nav-dot active" id="dot1"></div>
  <div class="nav-dot" id="dot2"></div>
</div>

<div id="canvas-container"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

let currentSlide = 0;
let locked = false;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);

/* ===== CAMERA POSITIONS ===== */
const cameraPositions = [
  { x: 3.5, y: 1.5, z: 0 },   // Slide 1 camera
  { x: 0, y: 7, z: 8 }        // Slide 2 camera
];

camera.position.set(
  cameraPositions[0].x,
  cameraPositions[0].y,
  cameraPositions[0].z
);

camera.lookAt(0,0,0);

const renderer = new THREE.WebGLRenderer({alpha:true,antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.getElementById("canvas-container").appendChild(renderer.domElement);

const cube = new THREE.Mesh(
  new RoundedBoxGeometry(1.3,1.3,1.3,4,0.015),
  new THREE.MeshStandardMaterial({color:0xd3d3d3,roughness:0.5})
);
cube.rotation.y = -Math.PI/4;


scene.add(cube);

scene.add(new THREE.AmbientLight(0xffffff,0.3));
const light = new THREE.DirectionalLight(0xffffff,3);
light.position.set(5,10,5);
scene.add(light);

let targetX = 0;
let targetY = 0;
let targetScale = 1;
let targetRotX = 0;


/* ===== TARGET CAMERA ===== */
let targetCamera = { ...cameraPositions[0] };

window.addEventListener("wheel",(e)=>{
  if(locked) return;
  locked = true;

  if(e.deltaY > 0 && currentSlide === 0){
    currentSlide = 1;
  }
  else if(e.deltaY < 0 && currentSlide === 1){
    currentSlide = 0;
  }

  document.getElementById("slides").style.transform =
    `translateY(-${currentSlide * 100}vh)`;

  document.getElementById("dot1").classList.toggle("active", currentSlide===0);
  document.getElementById("dot2").classList.toggle("active", currentSlide===1);

  if(currentSlide === 0){
    targetX = 0;
    targetY = 0;
    targetScale = 1;
    targetRotX = 0;

  } else {
    targetX = 4.5;
    targetY = 0.3;
    targetScale = 2.5;
    targetRotX = -0.3;
  }

  /* 🔥 Change camera target */
  targetCamera = { ...cameraPositions[currentSlide] };

  setTimeout(()=> locked=false,800);
});
const ease = 0.08;   // lower = slower

function animate(){
  requestAnimationFrame(animate);

  /* Cube movement */
  cube.position.x += (targetX - cube.position.x) * ease;

  cube.rotation.x += (targetRotX - cube.rotation.x) * ease;

  cube.position.y += (targetY - cube.position.y) * ease;


  const scaleNow = cube.scale.x + (targetScale - cube.scale.x) * 0.08;
  cube.scale.set(scaleNow,scaleNow,scaleNow);

  cube.rotation.y += 0.003;


  /* Smooth camera movement */
  camera.position.x += (targetCamera.x - camera.position.x) * 0.08;
  camera.position.y += (targetCamera.y - camera.position.y) * 0.08;
  camera.position.z += (targetCamera.z - camera.position.z) * 0.08;

  camera.lookAt(0,0,0);

  renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
